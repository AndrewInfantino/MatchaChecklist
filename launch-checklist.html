<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Roadmap — Canned Matcha Latte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6EFE3;
  --surface: #FBF6EC;
  --surface-2: #F1E8D7;
  --ink: #1F1814;
  --ink-soft: #4A3F37;
  --ink-muted: #8A7D6F;
  --line: #E4D8C3;
  --line-soft: #EFE5D2;
  --accent: #B85A3E;
  --accent-soft: #D89478;
  --done: #8A9176;
  --shadow: 0 1px 2px rgba(31,24,20,0.04), 0 8px 24px rgba(31,24,20,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
  padding: 0 0 120px;
  background-image:
    radial-gradient(circle at 0% 0%, rgba(184,90,62,0.05) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(184,90,62,0.03) 0%, transparent 50%);
}

/* ── STICKY HEADER ── */
#sticky-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(246,239,227,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 14px 24px;
}
.sticky-inner {
  max-width: 760px;
  margin: 0 auto;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  gap: 12px;
}
.progress-label {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  white-space: nowrap;
}
.progress-count {
  font-family: 'Fraunces', serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-soft);
  white-space: nowrap;
}
.progress-count span {
  color: var(--accent);
  font-weight: 500;
}
.progress-track {
  flex: 1;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.filter-row {
  display: flex;
  gap: 6px;
}
.filter-btn {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--accent-soft); color: var(--ink-soft); }
.filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ── PAGE HEADER ── */
.page-header {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 24px 48px;
}
.eyebrow {
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
}
.page-title {
  font-family: 'Fraunces', serif;
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 400;
  line-height: 1.08;
  color: var(--ink);
  margin-bottom: 16px;
}
.page-title em {
  font-style: italic;
  color: var(--accent);
}
.page-sub {
  font-size: 14px;
  color: var(--ink-muted);
  max-width: 520px;
  margin-bottom: 32px;
  font-style: italic;
}
.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn-outline {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 18px;
  border: 1px solid rgba(184,90,62,0.3);
  background: transparent;
  color: var(--accent);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  opacity: 0.7;
}
.btn-danger:hover { opacity: 1; background: rgba(184,90,62,0.06); }

/* ── MAIN CONTENT ── */
.container { max-width: 760px; margin: 0 auto; padding: 0 24px; }

/* ── PHASE ── */
.phase {
  margin-bottom: 48px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.phase-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 28px 28px 20px;
  cursor: pointer;
  user-select: none;
  gap: 16px;
}
.phase-header:hover .phase-toggle { color: var(--accent); }
.phase-meta { flex: 1; }
.phase-eyebrow {
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.phase-title {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.15;
  margin-bottom: 6px;
  outline: none;
  border: none;
  background: transparent;
  cursor: text;
}
.phase-title[contenteditable]:focus {
  border-bottom: 1px solid var(--accent);
}
.phase-subtitle {
  font-size: 12px;
  color: var(--ink-muted);
  font-style: italic;
}
.phase-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 4px;
  flex-shrink: 0;
}
.phase-toggle, .phase-del {
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.phase-toggle:hover { border-color: var(--accent); color: var(--accent); }
.phase-del:hover { border-color: #c0392b; color: #c0392b; }
.phase-body { padding: 0 28px 24px; }
.phase.collapsed .phase-body { display: none; }
.phase.collapsed .phase-toggle { transform: rotate(-90deg); }

/* ── GROUP ── */
.group { margin-bottom: 24px; }
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}
.group-title {
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  outline: none;
  background: transparent;
  border: none;
}
.group-title[contenteditable]:focus { border-bottom: 1px solid var(--accent-soft); color: var(--ink); }
.group-del {
  font-size: 12px;
  color: var(--line);
  cursor: pointer;
  border: none;
  background: none;
  transition: color 0.15s;
  padding: 2px 4px;
}
.group-del:hover { color: #c0392b; }

/* ── TASK ── */
.task {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 9px 10px;
  border-radius: 4px;
  transition: background 0.15s;
  position: relative;
}
.task:hover { background: var(--surface-2); }
.task.done .task-text {
  text-decoration: line-through;
  color: var(--ink-muted);
}
.task-check {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--line);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
  background: var(--surface);
}
.task-check:hover { border-color: var(--accent); }
.task.done .task-check {
  background: var(--done);
  border-color: var(--done);
}
.task.done .task-check::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1px;
  width: 5px;
  height: 9px;
  border: 1.5px solid white;
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}
.task-text {
  flex: 1;
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
  outline: none;
  min-width: 0;
  word-break: break-word;
  cursor: text;
}
.task-text[contenteditable]:focus { color: var(--ink); }
.task-del {
  font-size: 14px;
  color: var(--line);
  cursor: pointer;
  border: none;
  background: none;
  transition: color 0.15s;
  opacity: 0;
  flex-shrink: 0;
  padding: 2px 2px;
  line-height: 1;
  margin-top: 2px;
}
.task:hover .task-del { opacity: 1; }
.task-del:hover { color: #c0392b; }

/* ── ADD TASK ── */
.add-task-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  margin-top: 4px;
}
.add-task-input {
  flex: 1;
  border: none;
  border-bottom: 1px dashed var(--line);
  background: transparent;
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  color: var(--ink);
  padding: 4px 0;
  outline: none;
}
.add-task-input::placeholder { color: var(--line); }
.add-task-input:focus { border-color: var(--accent-soft); }
.add-task-btn {
  font-size: 18px;
  color: var(--line);
  cursor: pointer;
  border: none;
  background: none;
  line-height: 1;
  transition: color 0.15s;
  padding: 0 2px;
}
.add-task-btn:hover { color: var(--accent); }

/* ── ADD GROUP ── */
.add-group-row {
  margin-top: 16px;
}
.add-group-btn {
  font-family: 'Manrope', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 4px;
  padding: 7px 16px;
  cursor: pointer;
  width: 100%;
  transition: all 0.15s;
}
.add-group-btn:hover { border-color: var(--accent-soft); color: var(--accent); }

/* ── ADD PHASE ── */
.add-phase-row {
  margin-top: 16px;
  margin-bottom: 48px;
}
.add-phase-btn {
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 18px;
  cursor: pointer;
  width: 100%;
  transition: all 0.15s;
}
.add-phase-btn:hover { border-color: var(--accent-soft); color: var(--accent); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 40px 0;
  color: var(--ink-muted);
  font-style: italic;
  font-size: 14px;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 22px;
  border-radius: 24px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  white-space: nowrap;
  z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── HIDDEN FILE INPUT ── */
#import-input { display: none; }

@media (max-width: 600px) {
  .page-header { padding: 36px 20px 32px; }
  .container { padding: 0 16px; }
  .phase-header { padding: 20px 20px 14px; }
  .phase-body { padding: 0 20px 20px; }
  .page-title { font-size: 30px; }
}
</style>
</head>
<body>

<!-- STICKY PROGRESS BAR -->
<div id="sticky-bar">
  <div class="sticky-inner">
    <div class="progress-row">
      <div class="progress-label">Progress</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-count" id="progress-count"><span>0</span> of 178 · 0%</div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all')">All</button>
      <button class="filter-btn" onclick="setFilter('open')">Open</button>
      <button class="filter-btn" onclick="setFilter('done')">Done</button>
    </div>
  </div>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="eyebrow">Launch Roadmap</div>
  <h1 class="page-title">Every <em>single step</em><br>from zero.</h1>
  <p class="page-sub">Click any task to edit it. Check it off when done. Add, remove, or reorder steps freely.</p>
  <div class="header-actions">
    <button class="btn-outline" onclick="exportBackup()">↓ Export backup</button>
    <button class="btn-outline" onclick="document.getElementById('import-input').click()">↑ Import backup</button>
    <button class="btn-danger" onclick="resetData()">Reset to default</button>
  </div>
  <input type="file" id="import-input" accept=".json" onchange="importBackup(event)">
</div>

<!-- CHECKLIST -->
<div class="container" id="checklist-root"></div>

<!-- ADD PHASE BUTTON -->
<div class="container">
  <div class="add-phase-row">
    <button class="add-phase-btn" onclick="addPhase()">+ Add a new phase</button>
  </div>
</div>

<div id="toast"></div>

// ── STATE ──────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

let data = loadData();

// ── COUNTS ────────────────────────────────────────────────
function getCounts() {
  let total = 0, done = 0;
  data.phases.forEach(p => p.groups.forEach(g => g.tasks.forEach(t => {
    total++;
    if (t.done) done++;
  })));
  return { total, done };
}

function updateProgress() {
  const { total, done } = getCounts();
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').innerHTML = `<span>${done}</span> of ${total} · ${pct}%`;
}

// ── FILTER ────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFilter();
}
function applyFilter() {
  document.querySelectorAll('.task').forEach(el => {
    const isDone = el.classList.contains('done');
    if (activeFilter === 'all') el.style.display = '';
    else if (activeFilter === 'done') el.style.display = isDone ? '' : 'none';
    else el.style.display = isDone ? 'none' : '';
  });
  document.querySelectorAll('.group').forEach(el => {
    const visible = [...el.querySelectorAll('.task')].some(t => t.style.display !== 'none');
    el.style.display = visible ? '' : 'none';
  });
}

// ── ID GENERATOR ──────────────────────────────────────────
function uid() { return 'id-' + Math.random().toString(36).slice(2, 9); }

// ── RENDER ────────────────────────────────────────────────
function render() {
  const root = document.getElementById('checklist-root');
  root.innerHTML = '';
  data.phases.forEach((phase, pi) => {
    root.appendChild(renderPhase(phase, pi));
  });
  updateProgress();
  applyFilter();
}

function renderPhase(phase, pi) {
  const el = document.createElement('div');
  el.className = 'phase' + (phase.collapsed ? ' collapsed' : '');
  el.dataset.id = phase.id;

  el.innerHTML = `
    <div class="phase-header" onclick="togglePhase('${phase.id}', event)">
      <div class="phase-meta">
        <div class="phase-eyebrow">${phase.number}</div>
        <div class="phase-title" contenteditable="true" onclick="event.stopPropagation()" onblur="renamePhase('${phase.id}', this.textContent)">${phase.title}</div>
        <div class="phase-subtitle">${phase.subtitle}</div>
      </div>
      <div class="phase-controls">
        <button class="phase-del" title="Delete phase" onclick="deletePhase('${phase.id}', event)">×</button>
        <button class="phase-toggle" title="Collapse/expand">▾</button>
      </div>
    </div>
    <div class="phase-body" id="body-${phase.id}"></div>
  `;

  const body = el.querySelector('.phase-body');
  phase.groups.forEach((group) => {
    body.appendChild(renderGroup(group, phase.id));
  });

  const addGroupRow = document.createElement('div');
  addGroupRow.className = 'add-group-row';
  addGroupRow.innerHTML = `<button class="add-group-btn" onclick="addGroup('${phase.id}')">+ Add a group</button>`;
  body.appendChild(addGroupRow);

  return el;
}

function renderGroup(group, phaseId) {
  const el = document.createElement('div');
  el.className = 'group';
  el.dataset.id = group.id;

  const header = document.createElement('div');
  header.className = 'group-header';
  header.innerHTML = `
    <div class="group-title" contenteditable="true" onblur="renameGroup('${group.id}', this.textContent)">${group.title}</div>
    <button class="group-del" onclick="deleteGroup('${phaseId}', '${group.id}')">× remove group</button>
  `;
  el.appendChild(header);

  group.tasks.forEach((task) => {
    el.appendChild(renderTask(task, group.id));
  });

  if (group.tasks.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No tasks yet.';
    el.appendChild(empty);
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-task-row';
  addRow.innerHTML = `
    <input class="add-task-input" placeholder="Add a task…" data-group="${group.id}"
      onkeydown="if(event.key==='Enter'){addTask('${group.id}',this);event.preventDefault()}">
    <button class="add-task-btn" onclick="addTaskFromBtn('${group.id}', this)">+</button>
  `;
  el.appendChild(addRow);

  return el;
}

function renderTask(task, groupId) {
  const el = document.createElement('div');
  el.className = 'task' + (task.done ? ' done' : '');
  el.dataset.id = task.id;
  el.innerHTML = `
    <div class="task-check" onclick="toggleTask('${task.id}')"></div>
    <div class="task-text" contenteditable="true" onblur="renameTask('${task.id}', this.textContent)">${task.text}</div>
    <button class="task-del" onclick="deleteTask('${groupId}', '${task.id}')">×</button>
  `;
  return el;
}

// ── INTERACTIONS ──────────────────────────────────────────
function togglePhase(id, e) {
  if (e.target.classList.contains('phase-del') || e.target.contentEditable === 'true') return;
  const phase = data.phases.find(p => p.id === id);
  if (phase) { phase.collapsed = !phase.collapsed; saveData(); render(); }
}
function renamePhase(id, text) {
  const phase = data.phases.find(p => p.id === id);
  if (phase) { phase.title = text.trim() || phase.title; saveData(); }
}
function deletePhase(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this entire phase and all its tasks?')) return;
  data.phases = data.phases.filter(p => p.id !== id);
  saveData(); render(); showToast('Phase deleted');
}
function addPhase() {
  data.phases.push({
    id: uid(), number: 'Phase', title: 'New Phase', subtitle: 'Double-click to rename',
    collapsed: false, groups: [{ id: uid(), title: 'GROUP NAME', tasks: [] }]
  });
  saveData(); render(); showToast('Phase added');
}

function renameGroup(id, text) {
  data.phases.forEach(p => p.groups.forEach(g => {
    if (g.id === id) g.title = (text.trim().toUpperCase()) || g.title;
  }));
  saveData();
}
function deleteGroup(phaseId, groupId) {
  const phase = data.phases.find(p => p.id === phaseId);
  if (!phase) return;
  if (!confirm('Delete this group and all its tasks?')) return;
  phase.groups = phase.groups.filter(g => g.id !== groupId);
  saveData(); render(); showToast('Group deleted');
}
function addGroup(phaseId) {
  const phase = data.phases.find(p => p.id === phaseId);
  if (!phase) return;
  const name = prompt('Group name:');
  if (!name) return;
  phase.groups.push({ id: uid(), title: name.toUpperCase(), tasks: [] });
  saveData(); render(); showToast('Group added');
}

function toggleTask(id) {
  data.phases.forEach(p => p.groups.forEach(g => g.tasks.forEach(t => {
    if (t.id === id) t.done = !t.done;
  })));
  saveData(); render();
}
function renameTask(id, text) {
  data.phases.forEach(p => p.groups.forEach(g => g.tasks.forEach(t => {
    if (t.id === id) t.text = text.trim() || t.text;
  })));
  saveData();
}
function deleteTask(groupId, taskId) {
  data.phases.forEach(p => p.groups.forEach(g => {
    if (g.id === groupId) g.tasks = g.tasks.filter(t => t.id !== taskId);
  }));
  saveData(); render(); showToast('Task removed');
}
function addTask(groupId, input) {
  const text = input.value.trim();
  if (!text) return;
  data.phases.forEach(p => p.groups.forEach(g => {
    if (g.id === groupId) g.tasks.push({ id: uid(), text, done: false });
  }));
  input.value = '';
  saveData(); render(); showToast('Task added');
}
function addTaskFromBtn(groupId, btn) {
  const row = btn.closest('.add-task-row');
  const input = row.querySelector('.add-task-input');
  addTask(groupId, input);
}

// ── BACKUP ────────────────────────────────────────────────
function exportBackup() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hana-launch-checklist-backup.json';
  a.click();
  showToast('Backup downloaded');
}
function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.phases) throw new Error('Invalid format');
      data = parsed;
      saveData(); render();
      showToast('Backup imported');
    } catch(err) {
      alert('Could not import — invalid backup file.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function resetData() {
  if (!confirm('Reset to the original checklist? Your current progress will be lost. Consider exporting a backup first.')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(); render();
  showToast('Reset to default');
}

// ── TOAST ─────────────────────────────────────────────────
let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

// ── INIT ──────────────────────────────────────────────────
render();
saveData();
</script>
</body>
</html>
